[project]
name = "team-belote-re"
version = "1.0.0"
description = "Team Belote & Re - gestion de tournois de belote classique et coinchee"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
wsgi = ["a2wsgi>=1.10"]  # hebergeurs sans ASGI (PythonAnywhere...)

[tool.setuptools.packages.find]
include = ["tbr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
